version = 1
name = "porcelain"

[setup]
script = "npx --yes pnpm@12.3.4 install --frozen-lockfile"

[[actions]]
name = "Playground"
icon = "run"
command = "pnpm dev:playground"

[[actions]]
name = "Playground (manual auth)"
icon = "run"
command = "pnpm dev:playground --manual"

[[actions]]
name = "Web only"
icon = "run"
command = "pnpm dev:web"
