version = 1
name = "porcelain"

[setup]
script = '''
node scripts/worktree.mjs codex-bootstrap
pnpm install --frozen-lockfile
'''

[setup.win32]
script = '''
node scripts/worktree.mjs codex-bootstrap
if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
pnpm install --frozen-lockfile
exit $LASTEXITCODE
'''

[setup.darwin]
script = '''
set -e
node scripts/worktree.mjs codex-bootstrap
pnpm install --frozen-lockfile
'''

[setup.linux]
script = '''
set -e
node scripts/worktree.mjs codex-bootstrap
pnpm install --frozen-lockfile
'''

[cleanup]
script = '''
node scripts/worktree.mjs codex-cleanup
'''

[cleanup.win32]
script = '''
node scripts/worktree.mjs codex-cleanup
exit $LASTEXITCODE
'''

[cleanup.darwin]
script = '''
node scripts/worktree.mjs codex-cleanup
'''

[cleanup.linux]
