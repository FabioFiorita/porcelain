# THIS IS AUTOGENERATED. DO NOT EDIT MANUALLY
version = 1
name = "porcelain"

[setup]
script = "pnpm install --frozen-lockfile"

# Before Codex deletes a worktree: if it was adopted into the managed lifecycle
# (pnpm worktree adopt), release its managed state — port, channels, user data,
# playground — instead of orphaning it. Plain Codex worktrees have no config file,
# so this is a no-op for them.
[cleanup]
script = '''
cfg="$CODEX_WORKTREE_PATH/.porcelain-worktree.json"
if [ -f "$cfg" ]; then
  slug=$(node -p "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).slug" "$cfg")
  pnpm worktree remove "$slug" --force
fi
'''

[[actions]]
name = "Verify"
icon = "test"
command = "pnpm verify"

[[actions]]
name = "Dev daemon"
icon = "run"
command = "pnpm build && pnpm dev:daemon"

[[actions]]
name = "Browser e2e"
icon = "test"
command = "pnpm test:e2e"
