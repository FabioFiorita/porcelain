name: QA webhook

# Starts the QA reviewer once a pull request labelled `needs-qa` has green CI. The reviewer's
# webhook starts one run per POST and does not deduplicate, so send exactly once per commit:
# when CI succeeds on a labelled pull request, or when the label is added after CI already passed.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  pull_request:
    types: [labeled]

permissions:
  actions: read
  pull-requests: read

concurrency:
  group: qa-webhook-${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  notify:
    if: >-
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.event == 'pull_request'
        && github.event.workflow_run.conclusion == 'success')
      || (github.event_name == 'pull_request' && github.event.label.name == 'needs-qa')
    runs-on: ubuntu-latest
    steps:
      - name: Find the pull request and check that it is ready for QA
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR_FROM_LABEL: ${{ github.event.pull_request.number }}
          SHA_FROM_LABEL: ${{ github.event.pull_request.head.sha }}
          SHA_FROM_RUN: ${{ github.event.workflow_run.head_sha }}
          PR_FROM_RUN: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            number="$PR_FROM_LABEL"
            sha="$SHA_FROM_LABEL"
            ci=$(gh run list --repo "$REPO" --workflow CI --commit "$sha" --event pull_request \
              --json status,conclusion --jq 'first | "\(.status)/\(.conclusion)"')
            if [ "$ci" != completed/success ]; then
              echo "CI is $ci for $sha; the CI completion will send the webhook."
              exit 0
            fi
          else
            sha="$SHA_FROM_RUN"
            number="$PR_FROM_RUN"
            if [ -z "$number" ]; then
              echo "This CI run belongs to no pull request in this repository."
              exit 0
            fi
            state=$(gh pr view "$number" --repo "$REPO" --json state,headRefOid,labels \
              --jq '"\(.state) \(.headRefOid) ,\([.labels[].name] | join(",")),"')
            case "$state" in
              "OPEN $sha "*,needs-qa,*) ;;
              *) echo "#$number is not open at $sha with needs-qa ($state)."; exit 0 ;;
            esac
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Start the QA reviewer
        if: steps.pr.outputs.number != ''
        env:
          QA_WEBHOOK_URL: ${{ secrets.QA_WEBHOOK_URL }}
          QA_WEBHOOK_KEY: ${{ secrets.QA_WEBHOOK_KEY }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ steps.pr.outputs.number }}
          SHA: ${{ steps.pr.outputs.sha }}
        run: |
          if [ -z "$QA_WEBHOOK_URL" ] || [ -z "$QA_WEBHOOK_KEY" ]; then
            echo "::warning::QA_WEBHOOK_URL or QA_WEBHOOK_KEY is not set; skipping."
            exit 0
          fi
          body=$(jq -n --arg repo "$REPO" --argjson pr "$NUMBER" --arg sha "$SHA" \
            '{repository: $repo, pr: $pr, sha: $sha, url: "https://github.com/\($repo)/pull/\($pr)"}')
          curl --fail-with-body --silent --show-error --max-time 30 \
            -X POST "$QA_WEBHOOK_URL" \
            -H "Authorization: Bearer $QA_WEBHOOK_KEY" \
            -H "Content-Type: application/json" \
            -d "$body"
          echo
          echo "Started QA for #$NUMBER at $SHA."
