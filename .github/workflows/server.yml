name: Server trust checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          runtime: node@24.20.0
          cache: true
          require-lockfile: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck:server
      - run: pnpm lint:server
      - run: pnpm format:server:check
      - run: pnpm test
      - run: pnpm db:check
      - run: sudo apt-get update && sudo apt-get install --yes bubblewrap
      - name: Probe the sandbox; the runner cannot create a network namespace, so the net keeps the host network there
        run: bwrap --ro-bind / / --dev /dev --proc /proc --unshare-pid --unshare-ipc --new-session --die-with-parent -- true
      - name: Verification net without the network namespace (the host network is the only isolation the runner refuses)
        run: node .agents/skills/server-verify/scripts/verify.ts --all
        env:
          PORCELAIN_SANDBOX_NETWORK: host
      - run: pnpm arch:check
      - run: pnpm probes
