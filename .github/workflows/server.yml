name: Server trust checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          runtime: node@24.20.0
          cache: true
          require-lockfile: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck:server
      - run: pnpm lint:server
      - run: pnpm format:server:check
      - run: pnpm test
      - run: pnpm db:check
      - run: sudo apt-get update && sudo apt-get install --yes bubblewrap
      - run: bwrap --ro-bind / / --dev /dev --proc /proc --unshare-pid -- true
      - run: node .agents/skills/server-verify/scripts/verify.ts --all
      - run: pnpm arch:check
