name: Fast checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/setup@v3
        with:
          runtime: node@24.20.0
          cache: true
          require-lockfile: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm check --affected
      - run: pnpm test:integration --affected
