name: E2E

# The day-to-day e2e suite on every push to main: `pnpm test:e2e` (the browser
# project — headless Chromium against the daemon-served client, no display
# server). This is the ONLY place that suite runs per push, so don't fold it
# into another workflow's job chain.
# It lives beside ci.yml instead of inside it so the `pnpm verify` gate and e2e
# run as two workflows in parallel; sequencing them would roughly double the
# wall-clock wait on every push. The native Electron suite is separate again
# (e2e-native-dry-run.yml on macos-14, plus release.yml's package-mac).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Electron 42 has no postinstall, so a fresh install leaves the binary
      # missing; fetch it explicitly (idempotent, cached) before anything runs it.
      - run: node node_modules/electron/install.js
      - run: pnpm exec playwright install --with-deps chromium
      # The browser project drives the SAME built renderer dist and data path the
      # Electron window loads, so it asserts everything but the shell layer.
      # `*-browser-linux.png` baselines are asserted here.
      - run: pnpm test:e2e
