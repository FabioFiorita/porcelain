name: E2e native dry-run

# Optional macOS Electron e2e. Not on every push — day-to-day proof is browser e2e.
# Run manually before a packaging-sensitive ship, or when debugging shell-only bugs.
#
# Manual: Actions → E2e native dry-run → Run workflow.
on:
  workflow_dispatch:

jobs:
  native:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e:native:prebuilt
