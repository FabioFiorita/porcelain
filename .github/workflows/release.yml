name: Release

# The tag already exists on main. Package macOS, Windows, and the plain-Node daemon,
# publish the daemon to npm, then expose one GitHub release with both desktop platforms.
# Retry: re-run the failed job, or `gh workflow run release.yml -f tag=vX.Y.Z`.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to package and publish (e.g. v0.42.4). Required."
        required: true
        type: string

concurrency:
  group: porcelain-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Normalize tag
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG}"
          case "$TAG" in
            v*) ;;
            *) TAG="v$TAG" ;;
          esac
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release target $TAG ($VERSION)"

  package-mac:
    needs: [prepare]
    runs-on: macos-14
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: vercel/setup-turborepo-remote-cache-action@v1.0.0
        with:
          team: ${{ vars.TURBO_TEAM }}

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Require macOS signing and notarization credentials
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required macOS release secret: ${name}" >&2
              exit 1
            fi
          done

      - name: Package mac (sign + notarize, no publish)
        run: pnpm package:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Packaging smoke
        run: node scripts/release-fuse-smoke.mjs --platform mac --dir apps/desktop/dist

      - name: Verify macOS signature and notarization staple
        run: |
          set -euo pipefail
          APP_PATH=$(find apps/desktop/dist -type d -name '*.app' -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo 'No packaged macOS app was produced.' >&2
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          for dmg in apps/desktop/dist/*.dmg; do
            xcrun stapler validate "$dmg"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: release-mac-${{ needs.prepare.outputs.tag }}
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/latest-mac.yml
          if-no-files-found: error
          retention-days: 14

  package-windows:
    needs: [prepare]
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: vercel/setup-turborepo-remote-cache-action@v1.0.0
        with:
          team: ${{ vars.TURBO_TEAM }}

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Select Windows signing mode
        id: windows_signing
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: node scripts/windows-signing-mode.mjs

      - name: Package signed Windows artifacts (no publish)
        if: steps.windows_signing.outputs.enabled == 'true'
        run: pnpm package:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Package unsigned Windows artifacts (no publish)
        if: steps.windows_signing.outputs.enabled == 'false'
        run: pnpm package:win:unsigned
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Packaging smoke
        run: node scripts/release-fuse-smoke.mjs --platform win --dir apps/desktop/dist

      - name: Verify Windows installer signing mode
        shell: pwsh
        env:
          WINDOWS_SIGNING_ENABLED: ${{ steps.windows_signing.outputs.enabled }}
        run: |
          $installers = Get-ChildItem apps/desktop/dist -Filter *.exe
          if ($installers.Count -eq 0) { throw 'No Windows installer was produced.' }
          foreach ($installer in $installers) {
            $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
            if ($env:WINDOWS_SIGNING_ENABLED -eq 'true') {
              if ($signature.Status -ne 'Valid') {
                throw "Invalid Authenticode signature on $($installer.Name): $($signature.Status)"
              }
            } elseif ($signature.Status -ne 'NotSigned') {
              throw "Expected an unsigned Windows installer, but $($installer.Name) reported: $($signature.Status)"
            }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-${{ needs.prepare.outputs.tag }}
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/latest.yml
          if-no-files-found: error
          retention-days: 14

  # The Linux deliverable is the plain-Node daemon published as @fabiofiorita/porcelain.
  # Build it independently of the signed Mac job, then hand the exact assembled
  # package to the post-release npm publisher instead of rebuilding the workspace.
  package-daemon:
    needs: [prepare]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: vercel/setup-turborepo-remote-cache-action@v1.0.0
        with:
          team: ${{ vars.TURBO_TEAM }}

      - run: pnpm install --frozen-lockfile
      # The daemon package needs the shared web renderer plus the independent
      # daemon/CLI bundles, not the Electron shell or mobile typecheck.
      - run: pnpm build:web
      - run: pnpm build:node
      - run: pnpm daemon:dist

      - uses: actions/upload-artifact@v4
        with:
          name: release-daemon-${{ needs.prepare.outputs.tag }}
          path: dist-daemon
          if-no-files-found: error
          retention-days: 14

  publish-npm:
    needs: [prepare, package-daemon]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Download prepared Linux daemon
        uses: actions/download-artifact@v4
        with:
          name: release-daemon-${{ needs.prepare.outputs.tag }}
          path: dist-daemon

      - name: Publish @fabiofiorita/porcelain to npm
        run: |
          set -euo pipefail
          npm install -g npm@11.5.2
          cd dist-daemon
          PUBLISH_NPMRC="$(mktemp)"
          SMOKE_DIR="$(mktemp -d)"
          cleanup() {
            rm -f "$PUBLISH_NPMRC"
            rm -rf "$SMOKE_DIR"
          }
          trap cleanup EXIT
          printf 'registry=https://registry.npmjs.org/\n' > "$PUBLISH_NPMRC"
          unset NODE_AUTH_TOKEN || true
          export NPM_CONFIG_USERCONFIG="$PUBLISH_NPMRC"
          VER=$(node -p "require('./package.json').version")
          PKG=@fabiofiorita/porcelain
          TARBALL_URL="https://registry.npmjs.org/@fabiofiorita%2fporcelain/-/porcelain-${VER}.tgz"
          tarball_code() {
            local code
            if ! code=$(curl -sS -o /dev/null -w '%{http_code}' -L "$TARBALL_URL"); then
              code=000
            fi
            printf '%s' "$code"
          }
          # Registry can lag after a successful OIDC publish (large tarball).
          # Wait quietly for HTTP 200; a temporary 404 is normal propagation,
          # not a new failure on every probe.
          wait_tarball() {
            local attempts=60 sleep_s=10
            local i code
            echo "Waiting up to 10 minutes for ${PKG}@${VER} tarball propagation..."
            for i in $(seq 1 "$attempts"); do
              code=$(tarball_code)
              if [ "$code" = "200" ]; then
                echo "${PKG}@${VER} tarball is available after ${i} check(s)"
                return 0
              fi
              if [ $((i % 6)) -eq 0 ]; then
                echo "Still propagating after $((i * sleep_s))s..."
              fi
              if [ "$i" -lt "$attempts" ]; then
                sleep "$sleep_s"
              fi
            done
            echo "Last tarball response was HTTP ${code}" >&2
            return 1
          }
          # --prefer-online: the pre-publish check above seeds npm's packument
          # cache for five minutes, and a poll that re-reads that cache would
          # spend half its budget certain the version is missing.
          metadata_version() {
            npm view --prefer-online "${PKG}@${VER}" version 2>/dev/null || true
          }
          # Version metadata can lag behind the tarball. npx resolves the version
          # from metadata, so an ETARGET right after publish is propagation, not
          # a failed publish.
          wait_metadata() {
            local attempts=60 sleep_s=10
            local i seen
            echo "Waiting up to 10 minutes for ${PKG}@${VER} metadata propagation..."
            for i in $(seq 1 "$attempts"); do
              seen=$(metadata_version)
              if [ "$seen" = "$VER" ]; then
                echo "${PKG}@${VER} metadata is available after ${i} check(s)"
                return 0
              fi
              if [ $((i % 6)) -eq 0 ]; then
                echo "Still propagating after $((i * sleep_s))s..."
              fi
              if [ "$i" -lt "$attempts" ]; then
                sleep "$sleep_s"
              fi
            done
            echo "Last metadata response was \"${seen}\"" >&2
            return 1
          }

          if npm view "${PKG}@${VER}" version >/dev/null 2>&1; then
            echo "${PKG}@${VER} already published — verifying availability"
          else
            npm publish --access public
          fi

          if ! wait_tarball; then
            echo "${PKG}@${VER} metadata exists, but its tarball is still unavailable." >&2
            echo "Do not cut a new patch. Re-run this same tag after npm finishes propagating:" >&2
            echo "  gh workflow run release.yml -f tag=v${VER}" >&2
            echo "If latest stays unavailable for hours, inspect it manually on npmjs.com." >&2
            exit 1
          fi

          if ! wait_metadata; then
            echo "${PKG}@${VER} tarball exists, but its version metadata has not propagated." >&2
            echo "Do not cut a new patch. Re-run this same tag after npm finishes propagating:" >&2
            echo "  gh workflow run release.yml -f tag=v${VER}" >&2
            echo "If latest stays unavailable for hours, inspect it manually on npmjs.com." >&2
            exit 1
          fi

          # Run outside dist-daemon: inside a package with the same name, npx can
          # select the local package whose bin is not linked instead of fetching
          # the just-published consumer artifact.
          (
            cd "$SMOKE_DIR"
            npx --yes "${PKG}@${VER}" --help >/dev/null
          )
          echo "${PKG}@${VER} publish verified from a clean consumer directory"

  # Do not expose a Windows download until its matching WSL daemon package is
  # available. First-time WSL setup installs this exact product version from npm.
  publish:
    needs: [prepare, package-mac, package-windows, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download mac artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-mac-${{ needs.prepare.outputs.tag }}
          path: dist-mac

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-windows-${{ needs.prepare.outputs.tag }}
          path: dist-windows

      - name: Create/update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          TARGET=$(git rev-parse "${TAG}^{commit}" 2>/dev/null || git rev-parse "$TAG")
          node scripts/release-publish.mjs \
            --tag "$TAG" \
            --title "Porcelain ${VERSION}" \
            --target "$TARGET" \
            --assets dist-mac \
            --assets dist-windows \
            --cleanup-drafts
