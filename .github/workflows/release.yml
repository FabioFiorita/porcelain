name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: porcelain-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate the release or rehearsal
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'push' && github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          set -euo pipefail
          if [ -z "$TAG" ] && [ "$GITHUB_REF" != refs/heads/main ] && [ "$GITHUB_REF" != refs/heads/ci/rehearse-mac-readiness ]; then
            echo "Rehearsals must run from main; select main as the workflow ref." >&2
            exit 1
          fi
          version=$(node -p "require('./package.json').version")
          if [ -n "$TAG" ]; then
            if [ "$TAG" != "v$version" ]; then
              echo "Tag $TAG does not match the root package.json version $version." >&2
              exit 1
            fi
            candidate=$(git rev-parse 'HEAD^{commit}')
            git merge-base --is-ancestor "$candidate" origin/main
            git merge-base --is-ancestor "$candidate" origin/release
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?base=release&state=closed&per_page=100" |
              jq -ers --arg sha "$candidate" --arg repo "$GITHUB_REPOSITORY" '
                add | map(select(.merged_at and .base.ref == "release" and .head.ref == "main"
                  and .head.repo.full_name == $repo and .head.sha == $sha)) | first.merge_commit_sha // empty
              ' > "$RUNNER_TEMP/promoted-merge"
            merge=$(cat "$RUNNER_TEMP/promoted-merge")
            git merge-base --is-ancestor "$merge" origin/release
            git diff --quiet "$merge" "$candidate"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  mac:
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          runtime: node@26.13.0
          cache: true
          require-lockfile: true
      - run: pnpm install --frozen-lockfile
      - name: Import the Developer ID certificate into a temporary keychain
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/release.keychain-db"
          password=$(openssl rand -hex 24)
          printf '%s' "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$CSC_KEY_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
          echo "PORCELAIN_MAC_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - name: Build, sign and notarize the Mac app, its disk image and its update
        env:
          PORCELAIN_MAC_SIGNING_IDENTITY: 'Developer ID Application: Fabio Luiz Fiorita Pontes (9QH8M89WF9)'
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/build-desktop.ts --release
      - name: Verify what Gatekeeper will check
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          image="dist/desktop/Porcelain-$VERSION-arm64.dmg"
          app=$(find dist/desktop -maxdepth 2 -name Porcelain.app -type d -print -quit)
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          xcrun stapler validate "$image"
          spctl --assess --type open --context context:primary-signature --verbose "$image"
          test -f "$app/Contents/Resources/app-update.yml"
          grep -qx "version: \"$VERSION\"" dist/desktop/latest-mac.yml
          test -f "dist/desktop/Porcelain-$VERSION-arm64-mac.zip"
      - name: Launch Porcelain from its signed disk image
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: node scripts/check-desktop-release.ts "dist/desktop/Porcelain-$VERSION-arm64.dmg"
      - uses: actions/upload-artifact@v7
        with:
          name: mac
          path: |
            dist/desktop/*.dmg
            dist/desktop/*-mac.zip
            dist/desktop/latest-mac.yml
          if-no-files-found: error
          retention-days: 14
      - name: Remove the temporary keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true

  verify-desktop:
    needs: version
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          runtime: node@26.13.0
          cache: true
          require-lockfile: true
      - run: pnpm install --frozen-lockfile
      - name: Verify the desktop renderer stderr contract
        run: pnpm --filter @porcelain/desktop test:e2e window.e2e.ts --project portable --grep 'the app serves its window from a private loopback server'
      - name: Verify the desktop launcher with its disposable Keychain
        timeout-minutes: 5
        run: |
          cat > scripts/verify-dev-mac.ts <<'TS'
          import { mkdtemp, readFile } from 'node:fs/promises';
          import { join } from 'node:path';
          import type { DesktopBridge } from '@porcelain/contracts/desktop';
          import { startDesktop } from '../.agents/skills/desktop-verify/scripts/start.ts';

          declare const porcelainDesktop: DesktopBridge;

          const evidenceDirectory = await mkdtemp('/tmp/porcelain-verify-evidence-');
          console.log(`Desktop verification evidence: ${evidenceDirectory}`);
          try {
            const instance = await startDesktop({ id: '827f1eed', evidenceDirectory });
            try {
              const page = await instance.electron.firstWindow();
              await page.getByTestId('navigator').getByRole('button', { name: 'Open project' }).waitFor({ timeout: 10_000 });
              const available = await instance.electron.evaluate(({ safeStorage }) =>
                safeStorage.isEncryptionAvailable(),
              );
              console.log(`Porcelain Dev temporary HOME encryption available: ${available}`);
              const fixture = JSON.stringify([{ name: 'Disposable Keychain probe', credential: 'fixture-only-secret' }]);
              const result = await page.evaluate(async (value) => {
                await porcelainDesktop.credentials.write(value);
                const loaded = await porcelainDesktop.credentials.read();
                return loaded.status === 'saved' && loaded.value === value;
              }, fixture);
              const encrypted = await readFile(instance.card.credentialFiles.remoteEncrypted);
              console.log(`Porcelain Dev encrypted credential round-trip: ${result && !encrypted.includes('fixture-only-secret')}`);
              const electronLog = await readFile(join(evidenceDirectory, 'electron.log'), 'utf8');
              console.log(electronLog.split('\n').filter((line) => line.startsWith('Porcelain:')).join('\n'));
              if (!available || !result || encrypted.includes('fixture-only-secret'))
                throw new Error('Porcelain Dev did not preserve encrypted credentials with its temporary HOME');
            } finally {
              await instance.stop();
            }
          } catch (error) {
            console.error(error);
            const diagnostic = await readFile(join(evidenceDirectory, 'electron.log'), 'utf8').catch(() => '');
            console.error(diagnostic.split('\n').filter((line) => /Porcelain|Keychain|keychain/.test(line)).join('\n'));
            process.exitCode = 1;
          }
          TS
          node scripts/verify-dev-mac.ts

  release:
    needs: [version, mac]
    if: ${{ needs.version.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: mac
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          assets=("Porcelain-$VERSION-arm64.dmg" "Porcelain-$VERSION-arm64-mac.zip" latest-mac.yml)
          if draft=$(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null); then
            if [ "$draft" = true ]; then
              gh release upload "v$VERSION" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
              gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false
            else
              echo "Release v$VERSION already exists; keeping its published assets."
            fi
          else
            gh release create "v$VERSION" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "Porcelain $VERSION" \
              --generate-notes
          fi

  npm:
    needs: [version, release]
    if: ${{ needs.version.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          runtime: node@26.13.0
          cache: true
          require-lockfile: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:package
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.0
      - name: Use an npm that publishes through trusted publishing
        run: |
          set -euo pipefail
          npm install --global npm@11.21.0
          npm --version
      - name: Run the packed package before publishing
        id: package
        env:
          PACKAGE_TARBALL_DIRECTORY: ${{ runner.temp }}/checked-package
          VERSION: ${{ needs.version.outputs.version }}
        run: bash scripts/check-package.sh
      - name: Publish with npm trusted publishing
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          if npm view --prefer-online "@fabiofiorita/porcelain@$VERSION" version > /dev/null 2>&1; then
            echo "@fabiofiorita/porcelain@$VERSION is already published; continuing to verification."
          else
            npm publish "${{ steps.package.outputs.tarball }}" --provenance --access public
          fi

  npm-check:
    needs: [version, npm]
    if: ${{ needs.version.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.0
      - name: Install the published package from a clean folder
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          for attempt in $(seq 1 120); do
            if output=$(npx --yes --prefer-online "@fabiofiorita/porcelain@$VERSION" --version); then
              echo "$output"
              test "$output" = "porcelain v$VERSION"
              exit 0
            fi
            echo "npm has not served $VERSION yet (attempt $attempt of 120)"
            sleep 15
          done
          echo "$output" >&2
          exit 1
