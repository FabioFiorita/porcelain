name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: porcelain-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate the release or rehearsal
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'push' && github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          set -euo pipefail
          if [ -z "$TAG" ] && [ "$GITHUB_REF" != refs/heads/main ] && [ "$GITHUB_REF" != refs/heads/ci/rehearse-release-artifacts ]; then
            echo "Rehearsals must run from main; select main as the workflow ref." >&2
            exit 1
          fi
          version=$(node -p "require('./package.json').version")
          if [ -n "$TAG" ]; then
            if [ "$TAG" != "v$version" ]; then
              echo "Tag $TAG does not match the root package.json version $version." >&2
              exit 1
            fi
            candidate=$(git rev-parse 'HEAD^{commit}')
            git merge-base --is-ancestor "$candidate" origin/main
            git merge-base --is-ancestor "$candidate" origin/release
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?base=release&state=closed&per_page=100" |
              jq -ers --arg sha "$candidate" --arg repo "$GITHUB_REPOSITORY" '
                add | map(select(.merged_at and .base.ref == "release" and .head.ref == "main"
                  and .head.repo.full_name == $repo and .head.sha == $sha)) | first.merge_commit_sha // empty
              ' > "$RUNNER_TEMP/promoted-merge"
            merge=$(cat "$RUNNER_TEMP/promoted-merge")
            git merge-base --is-ancestor "$merge" origin/release
            git diff --quiet "$merge" "$candidate"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  mac:
    needs: version
    if: needs.version.outputs.publish == 'false'
    runs-on: macos-latest
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.0
      - uses: actions/download-artifact@v7
        id: image
        with:
          name: mac
          run-id: 45291167073
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/signed-image
      - name: Record macOS session and image attributes
        env:
          IMAGE: ${{ runner.temp }}/signed-image/Porcelain-${{ needs.version.outputs.version }}-arm64.dmg
        run: |
          sw_vers
          scutil <<< 'show State:/Users/ConsoleUser' || true
          /usr/bin/xattr -l "$IMAGE"
          /usr/sbin/spctl --assess --type open --context context:primary-signature --verbose "$IMAGE"
          security error -25307 || true
          security default-keychain -d user || true
      - name: Launch the signed app from the mounted image
        if: always() && steps.image.outcome == 'success'
        env:
          IMAGE: ${{ runner.temp }}/signed-image/Porcelain-${{ needs.version.outputs.version }}-arm64.dmg
        run: node scripts/check-desktop-release.ts "$IMAGE"
      - name: Launch the same signed app with a Keychain in its test home
        if: always() && steps.image.outcome == 'success'
        env:
          IMAGE: ${{ runner.temp }}/signed-image/Porcelain-${{ needs.version.outputs.version }}-arm64.dmg
          PORCELAIN_REHEARSAL_SCOPED_KEYCHAIN: 'true'
        run: node scripts/check-desktop-release.ts "$IMAGE"
      - name: Record system launch and code-signing diagnostics
        if: always() && steps.image.outcome == 'success'
        run: |
          /usr/bin/log show --last 5m --style compact --predicate 'process CONTAINS[c] "Porcelain" OR ((process == "amfid" OR process == "syspolicyd" OR process == "launchservicesd") AND eventMessage CONTAINS[c] "Porcelain")' | tail -160
          find "$HOME/Library/Logs/DiagnosticReports" -name 'Porcelain*' -print 2>/dev/null || true

  release:
    needs: [version, mac, package]
    if: ${{ needs.version.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: mac
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          assets=("Porcelain-$VERSION-arm64.dmg" "Porcelain-$VERSION-arm64-mac.zip" latest-mac.yml)
          if draft=$(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null); then
            if [ "$draft" = true ]; then
              gh release upload "v$VERSION" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
              gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false
            else
              echo "Release v$VERSION already exists; keeping its published assets."
            fi
          else
            gh release create "v$VERSION" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "Porcelain $VERSION" \
              --generate-notes
          fi

  package:
    needs: version
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          runtime: node@26.13.0
          cache: true
          require-lockfile: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:package
      - name: Run the packed package before publishing
        id: package
        env:
          PACKAGE_TARBALL_DIRECTORY: ${{ runner.temp }}/checked-package
          VERSION: ${{ needs.version.outputs.version }}
        run: bash scripts/check-package.sh
      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: ${{ steps.package.outputs.tarball }}
          if-no-files-found: error
          retention-days: 14

  npm:
    needs: [version, release]
    if: ${{ needs.version.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: npm-package
          path: ${{ runner.temp }}/checked-package
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.0
      - name: Use an npm that publishes through trusted publishing
        run: |
          set -euo pipefail
          npm install --global npm@11.21.0
          npm --version
      - name: Publish with npm trusted publishing
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          if npm view --prefer-online "@fabiofiorita/porcelain@$VERSION" version > /dev/null 2>&1; then
            echo "@fabiofiorita/porcelain@$VERSION is already published; continuing to verification."
          else
            shopt -s nullglob
            tarballs=("$RUNNER_TEMP/checked-package/"*.tgz)
            test "${#tarballs[@]}" = 1
            npm publish "${tarballs[0]}" --provenance --access public
          fi

  npm-check:
    needs: [version, npm]
    if: ${{ needs.version.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.0
      - name: Install the published package from a clean folder
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          for attempt in $(seq 1 120); do
            if output=$(npx --yes --prefer-online "@fabiofiorita/porcelain@$VERSION" --version); then
              echo "$output"
              test "$output" = "porcelain v$VERSION"
              exit 0
            fi
            echo "npm has not served $VERSION yet (attempt $attempt of 120)"
            sleep 15
          done
          echo "$output" >&2
          exit 1
