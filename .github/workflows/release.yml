name: Release

# The tag already exists on main. Package macOS and the plain-Node daemon,
# publish the GitHub release, then publish the prepared daemon to npm.
# Retry: re-run the failed job, or `gh workflow run release.yml -f tag=vX.Y.Z`.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to package and publish (e.g. v0.42.4). Required.'
        required: true
        type: string

concurrency:
  group: porcelain-release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Normalize tag
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG}"
          case "$TAG" in
            v*) ;;
            *) TAG="v$TAG" ;;
          esac
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release target $TAG ($VERSION)"

  package-mac:
    needs: [prepare]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Package mac (sign + notarize, no publish)
        run: pnpm package:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Packaging smoke
        run: node scripts/release-fuse-smoke.mjs --platform mac --dir apps/desktop/dist

      - uses: actions/upload-artifact@v4
        with:
          name: release-mac-${{ needs.prepare.outputs.tag }}
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/latest-mac.yml
          if-no-files-found: error
          retention-days: 14

  # The Linux deliverable is the plain-Node daemon published as porcelain-daemon.
  # Build it independently of the signed Mac job, then hand the exact assembled
  # package to the post-release npm publisher instead of rebuilding the workspace.
  package-daemon:
    needs: [prepare]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # The daemon package needs the shared web renderer plus the independent
      # daemon/CLI bundles, not the Electron shell or mobile typecheck.
      - run: pnpm build:web
      - run: pnpm build:node
      - run: pnpm daemon:dist

      - uses: actions/upload-artifact@v4
        with:
          name: release-daemon-${{ needs.prepare.outputs.tag }}
          path: dist-daemon
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [prepare, package-mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download mac artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-mac-${{ needs.prepare.outputs.tag }}
          path: dist-mac

      - name: Create/update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          TARGET=$(git rev-parse "${TAG}^{commit}" 2>/dev/null || git rev-parse "$TAG")
          node scripts/release-publish.mjs \
            --tag "$TAG" \
            --title "Porcelain ${VERSION}" \
            --target "$TARGET" \
            --assets dist-mac \
            --cleanup-drafts

  publish-npm:
    needs: [prepare, publish, package-daemon]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Download prepared Linux daemon
        uses: actions/download-artifact@v4
        with:
          name: release-daemon-${{ needs.prepare.outputs.tag }}
          path: dist-daemon

      - name: Publish porcelain-daemon to npm
        run: |
          set -euo pipefail
          npm install -g npm@11.5.2
          cd dist-daemon
          PUBLISH_NPMRC="$(mktemp)"
          SMOKE_DIR="$(mktemp -d)"
          cleanup() {
            rm -f "$PUBLISH_NPMRC"
            rm -rf "$SMOKE_DIR"
          }
          trap cleanup EXIT
          printf 'registry=https://registry.npmjs.org/\n' > "$PUBLISH_NPMRC"
          unset NODE_AUTH_TOKEN || true
          export NPM_CONFIG_USERCONFIG="$PUBLISH_NPMRC"
          VER=$(node -p "require('./package.json').version")
          PKG=porcelain-daemon
          TARBALL_URL="https://registry.npmjs.org/${PKG}/-/${PKG}-${VER}.tgz"
          tarball_code() {
            local code
            if ! code=$(curl -sS -o /dev/null -w '%{http_code}' -L "$TARBALL_URL"); then
              code=000
            fi
            printf '%s' "$code"
          }
          # Registry can lag after a successful OIDC publish (large tarball).
          # Wait quietly for HTTP 200; a temporary 404 is normal propagation,
          # not a new failure on every probe.
          wait_tarball() {
            local attempts=60 sleep_s=10
            local i code
            echo "Waiting up to 10 minutes for ${PKG}@${VER} tarball propagation..."
            for i in $(seq 1 "$attempts"); do
              code=$(tarball_code)
              if [ "$code" = "200" ]; then
                echo "${PKG}@${VER} tarball is available after ${i} check(s)"
                return 0
              fi
              if [ $((i % 6)) -eq 0 ]; then
                echo "Still propagating after $((i * sleep_s))s..."
              fi
              if [ "$i" -lt "$attempts" ]; then
                sleep "$sleep_s"
              fi
            done
            echo "Last tarball response was HTTP ${code}" >&2
            return 1
          }

          if npm view "${PKG}@${VER}" version >/dev/null 2>&1; then
            echo "${PKG}@${VER} already published — verifying availability"
          else
            npm publish --access public
          fi

          if ! wait_tarball; then
            echo "${PKG}@${VER} metadata exists, but its tarball is still unavailable." >&2
            echo "Do not cut a new patch. Re-run this same tag after npm finishes propagating:" >&2
            echo "  gh workflow run release.yml -f tag=v${VER}" >&2
            echo "If latest stays unavailable for hours, inspect it manually on npmjs.com." >&2
            exit 1
          fi

          # Run outside dist-daemon: inside a package with the same name, npx can
          # select the local package whose bin is not linked instead of fetching
          # the just-published consumer artifact.
          (
            cd "$SMOKE_DIR"
            npx --yes "${PKG}@${VER}" --help >/dev/null
          )
          echo "${PKG}@${VER} publish verified from a clean consumer directory"
