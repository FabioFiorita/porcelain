name: Release

# Side-project release (2026-07-27): simple path.
#   1. Tag already exists on main (pnpm release:cut bumps + tags + pushes).
#   2. This workflow packages macOS, publishes the GH Release, publishes npm.
# No pending branches. No multi-mode cut/retry soup.
# Retry: re-run the failed job, or `gh workflow run release.yml -f tag=vX.Y.Z`.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to package and publish (e.g. v0.42.4). Required.'
        required: true
        type: string

concurrency:
  group: porcelain-release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Normalize tag
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG}"
          case "$TAG" in
            v*) ;;
            *) TAG="v$TAG" ;;
          esac
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release target $TAG ($VERSION)"

  package-mac:
    needs: [prepare]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Package mac (sign + notarize, no publish)
        run: pnpm package:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Packaging smoke
        run: node scripts/release-fuse-smoke.mjs --platform mac --dir dist

      - uses: actions/upload-artifact@v4
        with:
          name: release-mac-${{ needs.prepare.outputs.tag }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest-mac.yml
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [prepare, package-mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download mac artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-mac-${{ needs.prepare.outputs.tag }}
          path: dist-mac

      - name: Create/update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          TARGET=$(git rev-parse "${TAG}^{commit}" 2>/dev/null || git rev-parse "$TAG")
          node scripts/release-publish.mjs \
            --tag "$TAG" \
            --title "Porcelain ${VERSION}" \
            --target "$TARGET" \
            --assets dist-mac \
            --cleanup-drafts

  publish-npm:
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Publish porcelain-daemon to npm
        run: |
          set -euo pipefail
          npm install -g npm@11.5.2
          pnpm daemon:dist
          cd dist-daemon
          PUBLISH_NPMRC="$(mktemp)"
          printf 'registry=https://registry.npmjs.org/\n' > "$PUBLISH_NPMRC"
          unset NODE_AUTH_TOKEN || true
          export NPM_CONFIG_USERCONFIG="$PUBLISH_NPMRC"
          VER=$(node -p "require('./package.json').version")
          PKG=porcelain-daemon
          TARBALL_URL="https://registry.npmjs.org/${PKG}/-/${PKG}-${VER}.tgz"
          tarball_code() {
            curl -sS -o /dev/null -w '%{http_code}' -L "$TARBALL_URL" || echo 000
          }
          # Registry can lag after a successful OIDC publish (large tarball).
          # Wait for HTTP 200; do not unpublish — lag is often temporary and
          # auto-rollback caused false failures. Re-run the same tag if needed.
          wait_tarball() {
            local attempts=60 sleep_s=10
            local i code
            for i in $(seq 1 "$attempts"); do
              code=$(tarball_code)
              echo "tarball probe ${VER} attempt ${i}/${attempts} → HTTP ${code}"
              if [ "$code" = "200" ]; then
                return 0
              fi
              sleep "$sleep_s"
            done
            return 1
          }

          # Only skip if this version already exists AND its tarball is downloadable.
          if npm view "${PKG}@${VER}" version >/dev/null 2>&1; then
            CODE=$(tarball_code)
            if [ "$CODE" = "200" ]; then
              echo "${PKG}@${VER} already published (tarball 200) — skip"
            else
              echo "${PKG}@${VER} exists but tarball HTTP ${CODE}" >&2
              echo "Often CDN lag after a prior publish. Re-run this workflow for the same tag later:" >&2
              echo "  gh workflow run release.yml -f tag=v${VER}" >&2
              echo "If it stays 404 for hours, unpublish by hand on npmjs.com (no CI unpublish)." >&2
              exit 1
            fi
          else
            npm publish --access public
            if ! wait_tarball; then
              echo "npm publish of ${PKG}@${VER} succeeded but tarball still not HTTP 200 after ~10m" >&2
              echo "Do not cut a new patch. Re-run the same tag when the registry catches up:" >&2
              echo "  gh workflow run release.yml -f tag=v${VER}" >&2
              echo "If latest is stuck on a 404 for hours, unpublish that version by hand." >&2
              exit 1
            fi
            npx --yes "${PKG}@${VER}" --help >/dev/null
            echo "${PKG}@${VER} publish verified"
          fi
          rm -f "$PUBLISH_NPMRC"
