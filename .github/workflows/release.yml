name: Release

# Releases the version in the root package.json from main: the notarized Mac app first,
# then the npm package, then one GitHub release tagged v<version> with the disk image.
# Start it with `gh workflow run release.yml` to rehearse: it builds, signs and notarizes the Mac app
# and publishes nothing. `gh workflow run release.yml -f publish=true` publishes. Re-running a failed
# job is safe until npm publishes.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to npm and create the GitHub release (otherwise rehearse the Mac build only)
        type: boolean
        default: false

concurrency:
  group: porcelain-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Read the release version and refuse one already released
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "Release v$version already exists; bump the root package.json version first." >&2
            exit 1
          fi
          if npm view "@fabiofiorita/porcelain@$version" version > /dev/null 2>&1; then
            echo "@fabiofiorita/porcelain@$version is already on npm; bump the root package.json version first." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  mac:
    needs: version
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          runtime: node@24.20.0
          cache: true
          require-lockfile: true
      - run: pnpm install --frozen-lockfile
      - name: Import the Developer ID certificate into a temporary keychain
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/release.keychain-db"
          password=$(openssl rand -hex 24)
          printf '%s' "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$CSC_KEY_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
          echo "PORCELAIN_MAC_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - name: Build, sign and notarize the Mac app and its disk image
        env:
          PORCELAIN_MAC_SIGNING_IDENTITY: 'Developer ID Application: Fabio Luiz Fiorita Pontes (9QH8M89WF9)'
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/build-desktop.ts --release
      - name: Verify what Gatekeeper will check
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          image="dist/desktop/Porcelain-$VERSION-arm64.dmg"
          app=$(find dist/desktop -maxdepth 2 -name Porcelain.app -type d -print -quit)
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          xcrun stapler validate "$image"
          spctl --assess --type open --context context:primary-signature --verbose "$image"
      - uses: actions/upload-artifact@v7
        with:
          name: mac
          path: dist/desktop/*.dmg
          if-no-files-found: error
          retention-days: 14
      - name: Remove the temporary keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true

  npm:
    needs: [version, mac]
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          runtime: node@24.20.0
          cache: true
          require-lockfile: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:package
      - name: Publish with npm trusted publishing
        working-directory: dist-porcelain
        run: npm publish --provenance --access public
      - name: Install the published package from a clean folder
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          for attempt in 1 2 3 4 5 6; do
            if output=$(npx --yes "@fabiofiorita/porcelain@$VERSION" --version 2>&1); then
              echo "$output"
              test "$output" = "porcelain v$VERSION"
              exit 0
            fi
            echo "npm has not served $VERSION yet (attempt $attempt)"
            sleep 20
          done
          exit 1

  release:
    needs: [version, mac, npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: mac
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "v$VERSION" "Porcelain-$VERSION-arm64.dmg" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Porcelain $VERSION" \
            --generate-notes
