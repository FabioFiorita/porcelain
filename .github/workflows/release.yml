name: Release

# Pushing a tag v<version> releases that commit: the notarized Mac app first, then the npm
# package, then the GitHub release for the tag with the disk image, and the zip and
# latest-mac.yml that the Mac app updates itself from. The tag must match the
# root package.json version and point at a commit on main.
# Running it by hand (`gh workflow run release.yml`) rehearses the signed and notarized Mac
# build from main and publishes nothing. Re-running a failed release is safe: npm publish is
# skipped when the version is already there, and the GitHub release is created last.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: porcelain-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate the release or rehearsal
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'push' && github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          set -euo pipefail
          if [ -z "$TAG" ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "Rehearsals must run from main; select main as the workflow ref." >&2
            exit 1
          fi
          version=$(node -p "require('./package.json').version")
          if [ -n "$TAG" ]; then
            if [ "$TAG" != "v$version" ]; then
              echo "Tag $TAG does not match the root package.json version $version." >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "Tag $TAG points at a commit that is not on main." >&2
              exit 1
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$TAG" ] && gh release view "v$version" > /dev/null 2>&1; then
            echo "Release v$version already exists; bump the root package.json version first." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  mac:
    needs: version
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          runtime: node@24.20.0
          cache: true
          require-lockfile: true
      - run: pnpm install --frozen-lockfile
      - name: Import the Developer ID certificate into a temporary keychain
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/release.keychain-db"
          password=$(openssl rand -hex 24)
          printf '%s' "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$CSC_KEY_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
          echo "PORCELAIN_MAC_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - name: Build, sign and notarize the Mac app, its disk image and its update
        env:
          PORCELAIN_MAC_SIGNING_IDENTITY: 'Developer ID Application: Fabio Luiz Fiorita Pontes (9QH8M89WF9)'
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/build-desktop.ts --release
      - name: Verify what Gatekeeper will check
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          image="dist/desktop/Porcelain-$VERSION-arm64.dmg"
          app=$(find dist/desktop -maxdepth 2 -name Porcelain.app -type d -print -quit)
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          xcrun stapler validate "$image"
          spctl --assess --type open --context context:primary-signature --verbose "$image"
          test -f "$app/Contents/Resources/app-update.yml"
          grep -qx "version: \"$VERSION\"" dist/desktop/latest-mac.yml
          test -f "dist/desktop/Porcelain-$VERSION-arm64-mac.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: mac
          path: |
            dist/desktop/*.dmg
            dist/desktop/*-mac.zip
            dist/desktop/latest-mac.yml
          if-no-files-found: error
          retention-days: 14
      - name: Remove the temporary keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true

  npm:
    needs: [version, mac]
    if: ${{ needs.version.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          runtime: node@24.20.0
          cache: true
          require-lockfile: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:package
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
      - name: Use an npm that publishes through trusted publishing
        run: |
          set -euo pipefail
          npm install --global npm@11.21.0
          npm --version
      - name: Run the packed package before publishing
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: bash scripts/check-package.sh
      - name: Publish with npm trusted publishing
        working-directory: dist-porcelain
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          if npm view --prefer-online "@fabiofiorita/porcelain@$VERSION" version > /dev/null 2>&1; then
            echo "@fabiofiorita/porcelain@$VERSION is already published; a re-run continues from the check."
          else
            npm publish --provenance --access public
          fi
      - name: Install the published package from a clean folder
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          # A new version can take several minutes to reach every npm mirror.
          for attempt in $(seq 1 40); do
            if output=$(npx --yes --prefer-online "@fabiofiorita/porcelain@$VERSION" --version); then
              echo "$output"
              test "$output" = "porcelain v$VERSION"
              exit 0
            fi
            echo "npm has not served $VERSION yet (attempt $attempt of 40)"
            sleep 15
          done
          echo "$output" >&2
          exit 1

  release:
    needs: [version, mac, npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: mac
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "v$VERSION" "Porcelain-$VERSION-arm64.dmg" \
            "Porcelain-$VERSION-arm64-mac.zip" latest-mac.yml \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Porcelain $VERSION" \
            --generate-notes
