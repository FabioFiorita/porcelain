name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  affected:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      server: ${{ steps.affected.outputs.server }}
      web-integration: ${{ steps.affected.outputs.web-integration }}
      web-e2e: ${{ steps.affected.outputs.web-e2e }}
      desktop: ${{ steps.affected.outputs.desktop }}
      storage: ${{ steps.affected.outputs.storage }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/setup@v3
        with:
          runtime: node@24.20.0
          cache: true
          require-lockfile: true
      - run: pnpm install --frozen-lockfile
      - name: Find affected runtime checks
        id: affected
        run: |
          pnpm exec turbo run test:integration test:e2e build db:check --affected --dry=json > "$RUNNER_TEMP/runtime.json"
          jq -e '.tasks | type == "array"' "$RUNNER_TEMP/runtime.json" > /dev/null
          server=$(jq 'any(.tasks[]; .taskId == "@porcelain/server#test:integration" or .taskId == "@porcelain/client#test:integration")' "$RUNNER_TEMP/runtime.json")
          web_integration=$(jq 'any(.tasks[]; .taskId == "@porcelain/web#test:integration")' "$RUNNER_TEMP/runtime.json")
          web_e2e=$(jq 'any(.tasks[]; .taskId == "@porcelain/web#test:e2e")' "$RUNNER_TEMP/runtime.json")
          desktop=$(jq 'any(.tasks[]; .taskId == "@porcelain/desktop#test:e2e")' "$RUNNER_TEMP/runtime.json")
          storage=$(jq 'any(.tasks[]; .taskId == "@porcelain/storage#db:check")' "$RUNNER_TEMP/runtime.json")
          for surface in server web_integration web_e2e desktop storage; do
            case "${!surface}" in
              true|false) printf '%s=%s\n' "${surface//_/-}" "${!surface}" >> "$GITHUB_OUTPUT" ;;
              *) exit 1 ;;
            esac
          done
          cat "$GITHUB_OUTPUT"

  static:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/setup@v3
        with:
          runtime: node@24.20.0
          cache: true
          require-lockfile: true
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - run: pnpm check:static --affected --concurrency=100%

  units:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          runtime: node@24.20.0
          cache: true
          require-lockfile: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  server-integration:
    needs: affected
    if: ${{ needs.affected.outputs.server == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/setup@v3
        with:
          runtime: node@24.20.0
          cache: true
          require-lockfile: true
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install --yes bubblewrap
      - name: Allow the disposable server's user namespace
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: bwrap --ro-bind / / --dev /dev --proc /proc --unshare-pid --unshare-ipc --unshare-net --new-session --die-with-parent -- true
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: pnpm exec turbo run test:integration --affected --filter=@porcelain/server --filter=@porcelain/client --concurrency=1 --continue

  web-integration:
    needs: affected
    if: ${{ needs.affected.outputs.web-integration == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/setup@v3
        with:
          runtime: node@24.20.0
          cache: true
          require-lockfile: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @porcelain/web build
      - run: sudo apt-get update && sudo apt-get install --yes bubblewrap
      - name: Allow the disposable server's user namespace
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: bwrap --ro-bind / / --dev /dev --proc /proc --unshare-pid --unshare-ipc --unshare-net --new-session --die-with-parent -- true
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: pnpm --filter @porcelain/web test:integration
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: web-integration
          path: apps/web/test-results/

  web-e2e:
    needs: affected
    if: ${{ needs.affected.outputs.web-e2e == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/setup@v3
        with:
          runtime: node@24.20.0
          cache: true
          require-lockfile: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @porcelain/web build
      - run: sudo apt-get update && sudo apt-get install --yes bubblewrap
      - name: Allow the disposable server's user namespace
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: bwrap --ro-bind / / --dev /dev --proc /proc --unshare-pid --unshare-ipc --unshare-net --new-session --die-with-parent -- true
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: pnpm --filter @porcelain/web test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: web-e2e
          path: apps/web/test-results/

  migrations:
    needs: affected
    if: ${{ needs.affected.outputs.storage == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/setup@v3
        with:
          runtime: node@24.20.0
          cache: true
          require-lockfile: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:check

  desktop-e2e:
    needs: affected
    if: ${{ needs.affected.outputs.desktop == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          runtime: node@24.20.0
          cache: true
          require-lockfile: true
      - run: pnpm install --frozen-lockfile
      - name: Cache Electron build headers
        uses: actions/cache@v6
        with:
          path: ~/.electron-gyp
          key: electron-headers-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/desktop/package.json') }}
      - run: pnpm --filter @porcelain/desktop test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: desktop-e2e
          path: |
            apps/desktop/test-results/
            ~/Library/Logs/DiagnosticReports/

  checks:
    needs:
      [
        affected,
        static,
        units,
        server-integration,
        web-integration,
        web-e2e,
        migrations,
        desktop-e2e,
      ]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected check to succeed
        run: test "$FAILED" = false
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
