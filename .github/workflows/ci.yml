name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: vercel/setup-turborepo-remote-cache-action@v1.0.0
        with:
          team: ${{ vars.TURBO_TEAM }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: vercel/setup-turborepo-remote-cache-action@v1.0.0
        with:
          team: ${{ vars.TURBO_TEAM }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm turbo run //#test:scripts

  # Exercise host-sensitive PTY, shell, and path behavior on macOS.
  unit-macos:
    runs-on: macos-14
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: vercel/setup-turborepo-remote-cache-action@v1.0.0
        with:
          team: ${{ vars.TURBO_TEAM }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm turbo run //#test:scripts

  # Windows owns a distinct daemon runtime: drive-rooted paths, ConPTY terminals,
  # Git for Windows, junction containment, and named-pipe agent channels must not be
  # inferred from Linux/macOS results.
  unit-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: vercel/setup-turborepo-remote-cache-action@v1.0.0
        with:
          team: ${{ vars.TURBO_TEAM }}
      - run: pnpm install --frozen-lockfile
      # Expand this lane as the remaining POSIX-only fixtures gain Windows-native
      # expectations. This set covers the supported path, persistence, MCP, terminal,
      # watcher, and packaging foundations without pretending the whole suite is green.
      - run: pnpm test:windows-foundation
      - run: pnpm turbo run //#test:scripts

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: vercel/setup-turborepo-remote-cache-action@v1.0.0
        with:
          team: ${{ vars.TURBO_TEAM }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:e2e
      - name: Install Chromium for browser E2E
        run: pnpm --dir apps/desktop exec playwright install --with-deps chromium
      - name: Run browser E2E
        run: pnpm test:e2e:prebuilt
