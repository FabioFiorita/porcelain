name: CI

on:
  pull_request:
  push:
    branches: [main, codex/porcelain-rebuild]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
      - run: npx --yes pnpm@12.3.4 install --frozen-lockfile
      - run: npx --yes pnpm@12.3.4 format:check
      - run: npx --yes pnpm@12.3.4 lint
      - run: npx --yes pnpm@12.3.4 typecheck
      - run: npx --yes pnpm@12.3.4 check:boundaries
      - run: npx --yes pnpm@12.3.4 check:unused
  specs:
    name: Specs and coverage (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
      - run: npx --yes pnpm@12.3.4 install --frozen-lockfile
      - run: npx --yes pnpm@12.3.4 test:coverage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: coverage-${{ matrix.os }}
          path: coverage/
          if-no-files-found: warn
          retention-days: 7
