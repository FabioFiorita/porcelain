name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  affected:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      server: ${{ steps.affected.outputs.server }}
      web-integration: ${{ steps.affected.outputs.web-integration }}
      web-e2e: ${{ steps.affected.outputs.web-e2e }}
      desktop: ${{ steps.affected.outputs.desktop }}
      storage: ${{ steps.affected.outputs.storage }}
      package: ${{ steps.affected.outputs.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3
        with:
          runtime: node@24.20.0
          cache: true
          require-lockfile: true
      - run: pnpm install --frozen-lockfile
      - name: Find affected runtime checks
        id: affected
        run: |
          pnpm exec turbo run test:integration test:e2e build build:package db:check --affected --dry=json > "$RUNNER_TEMP/runtime.json"
          jq -e '.tasks | type == "array"' "$RUNNER_TEMP/runtime.json" > /dev/null
          server=$(jq 'any(.tasks[]; .taskId == "@porcelain/server#test:integration" or .taskId == "@porcelain/client#test:integration" or .taskId == "@porcelain/verification#test:integration")' "$RUNNER_TEMP/runtime.json")
          web_integration=$(jq 'any(.tasks[]; .taskId == "@porcelain/web#test:integration")' "$RUNNER_TEMP/runtime.json")
          web_e2e=$(jq 'any(.tasks[]; .taskId == "@porcelain/web#test:e2e")' "$RUNNER_TEMP/runtime.json")
          desktop=$(jq 'any(.tasks[]; .taskId == "@porcelain/desktop#test:e2e")' "$RUNNER_TEMP/runtime.json")
          storage=$(jq 'any(.tasks[]; .taskId == "@porcelain/storage#db:check")' "$RUNNER_TEMP/runtime.json")
          package=$(jq 'any(.tasks[]; .taskId == "//#build:package")' "$RUNNER_TEMP/runtime.json")
          for surface in server web_integration web_e2e desktop storage package; do
            case "${!surface}" in
              true|false) printf '%s=%s\n' "${surface//_/-}" "${!surface}" >> "$GITHUB_OUTPUT" ;;
              *) exit 1 ;;
            esac
          done
          cat "$GITHUB_OUTPUT"

  static:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3
        with:
          runtime: node@24.20.0
          cache: true
          require-lockfile: true
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - run: pnpm check:static --affected --concurrency=100%

  units:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3
        with:
          runtime: node@24.20.0
          cache: true
          require-lockfile: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  package:
    needs: affected
    if: ${{ needs.affected.outputs.package == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3
        with:
          runtime: node@24.20.0
          cache: true
          require-lockfile: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:package
      - name: Pack, install and run the release package
        run: |
          VERSION=$(node -p "require('./package.json').version") bash scripts/check-package.sh

  server-integration:
    needs: affected
    if: ${{ needs.affected.outputs.server == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3
        with:
          runtime: node@24.20.0
          cache: true
          require-lockfile: true
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install --yes bubblewrap
      - name: Allow the disposable server's user namespace
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: bwrap --ro-bind / / --dev /dev --proc /proc --unshare-pid --unshare-ipc --unshare-net --new-session --die-with-parent -- true
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: pnpm exec turbo run test:integration --affected --filter=@porcelain/server --filter=@porcelain/client --filter=@porcelain/verification --concurrency=1 --continue

  web-integration:
    needs: affected
    if: ${{ needs.affected.outputs.web-integration == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3
        with:
          runtime: node@24.20.0
          cache: true
          require-lockfile: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @porcelain/web build
      - run: sudo apt-get update && sudo apt-get install --yes bubblewrap
      - name: Allow the disposable server's user namespace
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: bwrap --ro-bind / / --dev /dev --proc /proc --unshare-pid --unshare-ipc --unshare-net --new-session --die-with-parent -- true
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: pnpm --filter @porcelain/web test:integration --shard=${{ matrix.shard }}/3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: web-integration-${{ matrix.shard }}
          path: apps/web/test-results/

  web-e2e:
    needs: affected
    if: ${{ needs.affected.outputs.web-e2e == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3
        with:
          runtime: node@24.20.0
          cache: true
          require-lockfile: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @porcelain/web build
      - run: sudo apt-get update && sudo apt-get install --yes bubblewrap
      - name: Allow the disposable server's user namespace
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: bwrap --ro-bind / / --dev /dev --proc /proc --unshare-pid --unshare-ipc --unshare-net --new-session --die-with-parent -- true
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: pnpm --filter @porcelain/web test:e2e --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: web-e2e-${{ matrix.shard }}
          path: apps/web/test-results/

  migrations:
    needs: affected
    if: ${{ needs.affected.outputs.storage == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3
        with:
          runtime: node@24.20.0
          cache: true
          require-lockfile: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:check

  desktop-e2e:
    needs: affected
    if: ${{ needs.affected.outputs.desktop == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Record desktop job start
        run: touch "$RUNNER_TEMP/desktop-e2e-started"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3
        with:
          runtime: node@24.20.0
          cache: true
          require-lockfile: true
      - run: pnpm install --frozen-lockfile
      - name: Cache Electron build headers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.electron-gyp
          key: electron-headers-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/desktop/package.json') }}
      - run: pnpm --filter @porcelain/desktop test:e2e
      - name: Upload desktop test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: desktop-e2e
          path: apps/desktop/test-results/
      - name: Collect desktop crash reports
        if: failure()
        shell: bash
        run: |
          bash scripts/collect-desktop-crashes.sh \
            "$HOME/Library/Logs/DiagnosticReports" \
            "$RUNNER_TEMP/desktop-e2e-started" \
            "$RUNNER_TEMP/desktop-e2e-crashes"
      - name: Upload desktop crash reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: desktop-e2e-crashes
          path: ${{ runner.temp }}/desktop-e2e-crashes/

  checks:
    needs:
      [
        affected,
        static,
        units,
        package,
        server-integration,
        web-integration,
        web-e2e,
        migrations,
        desktop-e2e,
      ]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected check to succeed
        run: |
          if ! jq -e -n --argjson needs "$NEEDS" '
            {
              "package": "package",
              "server-integration": "server",
              "web-integration": "web-integration",
              "web-e2e": "web-e2e",
              "migrations": "storage",
              "desktop-e2e": "desktop"
            } as $gates |
            all(["affected", "static", "units"][]; $needs[.].result == "success") and
            all($gates | to_entries[];
              . as $gate |
              $needs.affected.outputs[$gate.value] as $selected |
              ($selected == "true" or $selected == "false") and
              ($needs[$gate.key].result == "success" or
                ($selected == "false" and $needs[$gate.key].result == "skipped"))
            )
          ' > /dev/null; then
            echo 'A required job did not succeed or its selection output was invalid.' >&2
            exit 1
          fi
        env:
          NEEDS: ${{ toJSON(needs) }}
