name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Preserve completed stress evidence while preparing the next cause fix.
  cancel-in-progress: ${{ github.head_ref != 'desktop-e2e-deflake' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      desktop: ${{ steps.affected.outputs.desktop }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/setup@v3
        with:
          runtime: node@24.20.0
          cache: true
          require-lockfile: true
      - run: pnpm install --frozen-lockfile
      - name: Find the affected e2e suites
        id: affected
        run: |
          pnpm exec turbo run test:e2e --affected --dry=json > "$RUNNER_TEMP/e2e.json"
          for app in web desktop; do
            echo "$app=$(jq --arg task "@porcelain/$app#test:e2e" 'any(.tasks[]; .taskId == $task)' "$RUNNER_TEMP/e2e.json")" >> "$GITHUB_OUTPUT"
          done
          cat "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - run: pnpm check --affected
      - run: sudo apt-get update && sudo apt-get install --yes bubblewrap
      - name: Allow unprivileged user namespaces, which Ubuntu 24.04 restricts through AppArmor and bwrap needs
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: bwrap --ro-bind / / --dev /dev --proc /proc --unshare-pid --unshare-ipc --unshare-net --new-session --die-with-parent -- true
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: pnpm test:integration --affected --continue
      - if: ${{ !cancelled() && steps.affected.outputs.web == 'true' }}
        run: pnpm --filter @porcelain/web test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: web-e2e
          path: apps/web/test-results/

  desktop-e2e:
    needs: checks
    if: ${{ !cancelled() && needs.checks.outputs.desktop == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          runtime: node@24.20.0
          cache: true
          require-lockfile: true
      - run: pnpm install --frozen-lockfile
      - name: Cache Electron build headers
        uses: actions/cache@v6
        with:
          path: ~/.electron-gyp
          key: electron-headers-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/desktop/package.json') }}
      - run: pnpm --filter @porcelain/desktop test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: desktop-e2e
          path: |
            apps/desktop/test-results/
            ~/Library/Logs/DiagnosticReports/

  # Temporary investigation jobs; remove before leaving draft.
  desktop-stress:
    if: github.head_ref == 'desktop-e2e-deflake'
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: changed-specs
            arguments: spec/e2e/window.e2e.ts spec/e2e/review-summaries.e2e.ts
          - target: suite-a
            arguments: --repeat-each=10
          - target: suite-b
            arguments: --repeat-each=10
          - target: reopen-quit
            arguments: spec/e2e/window.e2e.ts --grep "Quit while reopening" --repeat-each=100
          - target: remote-summary
            arguments: spec/e2e/review-summaries.e2e.ts --grep "a remote computer summary" --repeat-each=100
          - target: remote-summary-b
            arguments: spec/e2e/review-summaries.e2e.ts --grep "a remote computer summary" --repeat-each=100
          - target: before-input-ack
            arguments: spec/e2e/review-summaries.e2e.ts --grep "a remote computer summary" --repeat-each=20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/setup@v3
        with:
          runtime: node@24.20.0
          cache: true
          require-lockfile: true
      - run: pnpm install --frozen-lockfile
      - name: Cache Electron build headers
        uses: actions/cache@v6
        with:
          path: ~/.electron-gyp
          key: electron-headers-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/desktop/package.json') }}
      - name: Restore the CDP input comparison
        if: matrix.target == 'before-input-ack'
        run: git restore --source=af54d4711 -- apps/desktop/spec/e2e/review-summaries.e2e.ts
      - if: matrix.target != 'before-input-ack'
        run: pnpm --filter @porcelain/desktop test:e2e ${{ matrix.arguments }}
      - name: Capture CDP input acknowledgements
        if: matrix.target == 'before-input-ack'
        run: DEBUG=pw:protocol pnpm --filter @porcelain/desktop test:e2e ${{ matrix.arguments }} > "$RUNNER_TEMP/input-protocol.log" 2>&1
      - name: Prove cached headers rebuild without a header server
        if: ${{ !cancelled() }}
        run: |
          electron_version=$(node -p "require('./apps/desktop/package.json').dependencies.electron")
          pnpm exec electron-rebuild --force --version "$electron_version" --module-dir dist/desktop/e2e --only better-sqlite3 --dist-url http://127.0.0.1:9
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: desktop-stress-${{ matrix.target }}
          path: |
            apps/desktop/test-results/
            ~/Library/Logs/DiagnosticReports/
            ${{ runner.temp }}/input-protocol.log
