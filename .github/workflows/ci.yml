name: CI

on:
  pull_request:
    branches: [main, release]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

env:
  RELEASE_LANE: ${{ github.base_ref == 'release' }}
  DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  affected:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      server: ${{ steps.affected.outputs.server }}
      web-integration: ${{ steps.affected.outputs.web-integration }}
      web-e2e: ${{ steps.affected.outputs.web-e2e }}
      shards: ${{ steps.affected.outputs.shards }}
      browser-shards: ${{ steps.affected.outputs.browser-shards }}
      integration: ${{ steps.affected.outputs.integration }}
      e2e: ${{ steps.affected.outputs.e2e }}
      desktop: ${{ steps.affected.outputs.desktop }}
      storage: ${{ steps.affected.outputs.storage }}
      package: ${{ steps.affected.outputs.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3
        with:
          runtime: node@26.13.0
          cache: false
          require-lockfile: true
      - name: Select checks for this lane
        id: affected
        env:
          VALID_PROMOTION: ${{ github.head_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          if [[ "$RELEASE_LANE" == true && "$VALID_PROMOTION" != true ]]; then
            echo 'Promote the main branch of this repository into release.' >&2
            exit 1
          fi
          node ci/runtime-plan.ts >> "$GITHUB_OUTPUT"

  static:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3
        with:
          runtime: node@26.13.0
          cache: true
          save-cache: false
          require-lockfile: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:static --ci

  units:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3
        with:
          runtime: node@26.13.0
          cache: true
          save-cache: true
          require-lockfile: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:unit --ci
      - name: Verify production mobile exports
        if: github.base_ref == 'release'
        run: pnpm exec vp run @porcelain/mobile#build

  package:
    needs: affected
    if: ${{ needs.affected.outputs.package == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ['24.20.0', '26.13.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3
        with:
          runtime: node@${{ matrix.node }}
          cache: true
          save-cache: false
          require-lockfile: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:package
      - name: Pack, install and run the release package
        run: |
          VERSION=$(node -p "require('./package.json').version") bash scripts/check-package.sh

  server-integration:
    needs: affected
    if: ${{ needs.affected.outputs.server == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3
        with:
          runtime: node@26.13.0
          cache: true
          save-cache: false
          require-lockfile: true
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/setup-apt-mirrors
      - run: sudo apt-get update && sudo apt-get install --yes bubblewrap
      - name: Allow the disposable server's user namespace
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: bwrap --ro-bind / / --dev /dev --proc /proc --unshare-pid --unshare-ipc --unshare-net --new-session --die-with-parent -- true
      - run: pnpm exec playwright install --only-shell chromium
      - run: pnpm exec vp run --concurrency-limit 1 --filter @porcelain/server --filter @porcelain/client --filter @porcelain/verification test:integration

  web-integration:
    needs: affected
    if: ${{ needs.affected.outputs.web-integration == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.affected.outputs.browser-shards || '[1]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3
        with:
          runtime: node@26.13.0
          cache: true
          save-cache: false
          require-lockfile: true
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/setup-apt-mirrors
      - run: sudo apt-get update && sudo apt-get install --yes bubblewrap
      - name: Allow the disposable server's user namespace
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: bwrap --ro-bind / / --dev /dev --proc /proc --unshare-pid --unshare-ipc --unshare-net --new-session --die-with-parent -- true
      - run: pnpm exec playwright install --only-shell chromium
      - if: github.base_ref == 'release'
        run: pnpm --filter @porcelain/web test:integration --shard=${{ matrix.shard }}/${{ strategy.job-total }}
      - if: github.base_ref != 'release'
        env:
          SPECS: ${{ needs.affected.outputs.integration }}
        run: |
          mapfile -d '' files < <(jq -j '.[] | ., "\u0000"' <<< "$SPECS")
          (( ${#files[@]} > 0 ))
          pnpm --filter @porcelain/web test:integration "${files[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: web-integration-${{ matrix.shard }}
          path: apps/web/test-results/

  web-e2e:
    needs: affected
    if: ${{ needs.affected.outputs.web-e2e == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.affected.outputs.shards || '[1]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3
        with:
          runtime: node@26.13.0
          cache: true
          save-cache: false
          require-lockfile: true
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/setup-apt-mirrors
      - run: sudo apt-get update && sudo apt-get install --yes bubblewrap
      - name: Allow the disposable server's user namespace
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: bwrap --ro-bind / / --dev /dev --proc /proc --unshare-pid --unshare-ipc --unshare-net --new-session --die-with-parent -- true
      - run: pnpm exec playwright install --only-shell chromium
      - if: github.base_ref == 'release'
        run: pnpm --filter @porcelain/web test:e2e --shard=${{ matrix.shard }}/${{ strategy.job-total }}
      - if: github.base_ref != 'release'
        env:
          SPECS: ${{ needs.affected.outputs.e2e }}
        run: |
          mapfile -d '' files < <(jq -j '.[] | ., "\u0000"' <<< "$SPECS")
          (( ${#files[@]} > 0 ))
          for spec in "${files[@]}"; do
            pnpm --filter @porcelain/web test:e2e "$spec" --workers=1
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: web-e2e-${{ matrix.shard }}
          path: apps/web/test-results/

  migrations:
    needs: affected
    if: ${{ needs.affected.outputs.storage == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3
        with:
          runtime: node@26.13.0
          cache: true
          save-cache: false
          require-lockfile: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:check

  desktop-e2e:
    needs: affected
    if: ${{ needs.affected.outputs.desktop == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Record desktop job start
        run: touch "$RUNNER_TEMP/desktop-e2e-started"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3
        with:
          runtime: node@26.13.0
          cache: false
          require-lockfile: true
      - run: pnpm install --frozen-lockfile
      - name: Cache Electron build headers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.electron-gyp
          key: electron-headers-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/desktop/package.json') }}
      - name: Run portable Electron journeys on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm --filter @porcelain/desktop test:e2e --project portable
      - name: Run portable and native Electron journeys on macOS
        if: runner.os == 'macOS'
        run: pnpm --filter @porcelain/desktop test:e2e
      - name: Upload desktop test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: desktop-e2e-${{ runner.os }}
          path: apps/desktop/test-results/
      - name: Collect desktop crash reports
        if: failure() && runner.os == 'macOS'
        shell: bash
        run: |
          bash scripts/collect-desktop-crashes.sh \
            "$HOME/Library/Logs/DiagnosticReports" \
            "$RUNNER_TEMP/desktop-e2e-started" \
            "$RUNNER_TEMP/desktop-e2e-crashes"
      - name: Upload desktop crash reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure() && runner.os == 'macOS'
        with:
          name: desktop-e2e-crashes
          path: ${{ runner.temp }}/desktop-e2e-crashes/

  checks:
    name: ${{ github.base_ref == 'release' && 'release checks' || 'checks' }}
    needs:
      [
        affected,
        static,
        units,
        package,
        server-integration,
        web-integration,
        web-e2e,
        migrations,
        desktop-e2e,
      ]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected check to succeed
        run: |
          if ! jq -e -n --argjson needs "$NEEDS" '
            {
              "package": "package",
              "server-integration": "server",
              "web-integration": "web-integration",
              "web-e2e": "web-e2e",
              "migrations": "storage",
              "desktop-e2e": "desktop"
            } as $gates |
            all(["affected", "static", "units"][]; $needs[.].result == "success") and
            all($gates | to_entries[];
              . as $gate |
              $needs.affected.outputs[$gate.value] as $selected |
              ($selected == "true" or $selected == "false") and
              ($needs[$gate.key].result == "success" or
                ($selected == "false" and $needs[$gate.key].result == "skipped"))
            )
          ' > /dev/null; then
            echo 'A required job did not succeed or its selection output was invalid.' >&2
            exit 1
          fi
        env:
          NEEDS: ${{ toJSON(needs) }}
