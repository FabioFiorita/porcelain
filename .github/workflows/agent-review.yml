name: Agent review

on:
  pull_request_target:
    types: [labeled, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: >-
      contains(github.event.pull_request.labels.*.name, 'agent-review') &&
      (github.event.action != 'labeled' || github.event.label.name == 'agent-review')
    concurrency:
      group: agent-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3
        with:
          runtime: node@24.20.0
          cache: true
          save-cache: false
          require-lockfile: true
      - run: pnpm install --frozen-lockfile --ignore-scripts --filter @porcelain/ci
      - name: Review the pull request and publish the verdict
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: exec node ci/review.ts
