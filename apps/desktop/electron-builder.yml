appId: com.fabiofiorita.porcelain
productName: Porcelain
# Flip Electron security fuses on the packaged binary before signing.
# See build/after-pack.js for the fuse set and smoke-test instructions.
afterPack: build/after-pack.js
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!e2e/**'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!playwright.{config,shots.config}.ts'
  - '!{.claude,.agents,.codex,docs}/**'
  - '!{biome.json,components.json,vitest.config.ts,setupTests.ts,AGENTS.md,CLAUDE.md,README.md,CHANGELOG.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
  # node-pty ships a native addon (pty.node) + a `spawn-helper` binary it execs at
  # runtime; both must live on disk outside app.asar (and get signed there) or the
  # embedded terminal can't spawn a PTY in the packaged app.
  - node_modules/node-pty/**
  - node_modules/trash/**
mac:
  target:
    - target: dmg
      arch: [arm64]
    # zip is what electron-updater actually downloads on macOS
    - target: zip
      arch: [arm64]
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Pin the distribution identity: the CSC_LINK p12 also carries the Apple
  # Development cert, so name the Developer ID one explicitly.
  identity: 'Fabio Luiz Fiorita Pontes (9QH8M89WF9)'
  # Notarize via notarytool using APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD /
  # APPLE_TEAM_ID env vars (set as repo secrets).
  notarize: true
win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.png
  # electron-builder signs when its standard CSC_LINK / CSC_KEY_PASSWORD credentials are
  # present in the release environment. Keep the signature modern for SmartScreen and updater
  # verification without requiring a certificate for local/package-only builds.
  signtoolOptions:
    signingHashAlgorithms: [sha256]
  verifyUpdateCodeSignature: true
dmg:
  # Literal, not ${name}: that macro expands this package's scoped name
  # (@porcelain/desktop) verbatim — a slash in the artifact filename.
  artifactName: porcelain-${version}.${ext}
nsis:
  artifactName: porcelain-${version}-windows-${arch}-setup.${ext}
npmRebuild: false
publish:
  provider: github
  owner: fabiofiorita
  repo: porcelain
