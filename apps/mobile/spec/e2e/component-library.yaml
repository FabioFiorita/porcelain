appId: com.fabiofiorita.porcelain.dev
name: Inspect primitives through the development catalog
---
- runFlow: connect.yaml
- runFlow: open-settings.yaml
- tapOn: Component library
- assertVisible: Open a primitive to inspect its variants.
- tapOn: Explore Button
- assertVisible: 'Actions: 0'
- tapOn: Default
- assertVisible: 'Actions: 1'
- tapOn: Back
- swipe:
    start: 50%, 70%
    end: 50%, 30%
- assertVisible: Explore FileTree
- tapOn: Explore FileTree
- tapOn: Open button.tsx
- assertVisible: 'Selected: button'
- longPressOn: Open input.tsx
- tapOn: Show details
- assertVisible: 'Menu action: input.tsx · A'
- assertVisible: 'Selected: button'
- tapOn: Open README.md
- assertVisible: 'Selected: readme'
- tapOn: Back
- assertVisible: Open a primitive to inspect its variants.
- tapOn: Back
- assertVisible: No environments paired.
- assertVisible: Component library
