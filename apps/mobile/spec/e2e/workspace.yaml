appId: com.fabiofiorita.porcelain.dev
name: Select environment project and worktree without leaving Files
---
- tapOn: Files
- assertVisible:
    text: Files
    selected: true
- tapOn: Workspace
- tapOn: Environment
- tapOn: ${FIRST_ENVIRONMENT_NAME}
- tapOn: ${FIRST_ENVIRONMENT_NAME}
- tapOn: Project
- tapOn: ${FIRST_PROJECT_NAME}
- tapOn: ${FIRST_WORKTREE_LABEL}
- assertVisible: ${FIRST_PROJECT_NAME} · ${FIRST_WORKTREE_LABEL}
- assertVisible:
    text: Files
    selected: true
- tapOn: ${FIRST_PROJECT_NAME} · ${FIRST_WORKTREE_LABEL}
- tapOn: Environment
- tapOn: ${SECOND_ENVIRONMENT_NAME}
- tapOn: ${SECOND_ENVIRONMENT_NAME}
- tapOn: Project
- tapOn: ${SECOND_PROJECT_NAME}
- tapOn: ${SECOND_WORKTREE_LABEL}
- assertVisible: ${SECOND_PROJECT_NAME} · ${SECOND_WORKTREE_LABEL}
- assertVisible:
    text: Files
    selected: true
- tapOn: ${SECOND_PROJECT_NAME} · ${SECOND_WORKTREE_LABEL}
- tapOn: Environment
- tapOn: ${FIRST_ENVIRONMENT_NAME}
- assertVisible: ${FIRST_PROJECT_NAME} · ${FIRST_WORKTREE_LABEL}
- assertVisible:
    text: Files
    selected: true
