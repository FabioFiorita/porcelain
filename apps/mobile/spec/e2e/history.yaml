appId: com.fabiofiorita.porcelain.dev
name: Browse commits and changed files in History
---
- runFlow: connect.yaml
- runFlow: open-settings.yaml
- runFlow: add-environment.yaml
- runFlow:
    file: open-link.yaml
    env:
      LINK: ${HISTORY_LINK}
- assertVisible: Select a worktree to continue.
- tapOn: Workspace
- tapOn: Environment
- tapOn: ${ENVIRONMENT_NAME}
- tapOn: ${ENVIRONMENT_NAME}
- tapOn: Project
- tapOn: ${PROJECT_NAME}
- tapOn: ${WORKTREE_LABEL}
- assertVisible:
    id: history-commit-${RENAME_OID}
- assertVisible:
    id: history-commit-${UPDATE_OID}
- assertVisible:
    id: history-commit-${ROOT_OID}
- assertVisible: Start of history.
- tapOn:
    id: history-commit-${RENAME_OID}
- assertVisible: Changed files
- assertVisible: ${README_PATH} → GUIDE.md, renamed
- tapOn:
    id: history-file-GUIDE.md
- assertVisible: rename from ${README_PATH}
- assertVisible: rename to GUIDE.md
- tapOn: Back to commit
- tapOn: Back to history
- tapOn:
    id: history-commit-${UPDATE_OID}
- assertVisible: History commit body
- assertVisible: Changed files
- assertVisible: ${README_PATH}, modified
- tapOn:
    id: history-file-${README_PATH}
- assertVisible:
    text: 'Added line 1: History readme'
- tapOn: Back to commit
- tapOn: Back to history
- tapOn:
    id: history-commit-${ROOT_OID}
- assertVisible: Root commit
- assertVisible: Changed files
- assertVisible: ${README_PATH}, added
- tapOn:
    id: history-file-${README_PATH}
- assertVisible:
    text: 'Added line 1: # Sample repository'
- tapOn: Back to commit
- tapOn: ${PROJECT_NAME} · ${WORKTREE_LABEL}
- tapOn: Project
- tapOn: ${PROJECT_NAME}
- tapOn: ${ORIGINAL_WORKTREE}
- assertNotVisible: Back to history
- assertVisible:
    id: history-commit-${ROOT_OID}
- assertNotVisible:
    id: history-commit-${RENAME_OID}
- assertNotVisible:
    id: history-commit-${UPDATE_OID}
- tapOn:
    id: history-commit-${ROOT_OID}
- assertVisible: Root commit
- tapOn: ${PROJECT_NAME} · ${ORIGINAL_WORKTREE}
- tapOn: Project
- tapOn: ${PROJECT_NAME}
- tapOn: ${WORKTREE_LABEL}
- assertNotVisible: Back to history
- tapOn: Refresh history
- assertVisible:
    id: history-commit-${RENAME_OID}
