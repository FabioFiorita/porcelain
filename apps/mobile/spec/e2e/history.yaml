appId: com.fabiofiorita.porcelain.dev
name: Browse commits and changed files in History
---
- runFlow: connect.yaml
- runFlow: open-settings.yaml
- runFlow: add-environment.yaml
- runFlow:
    file: open-link.yaml
    env:
      LINK: ${HISTORY_LINK}
- assertVisible: Select a worktree to continue.
- tapOn: Workspace
- tapOn: Environment
- tapOn: ${ENVIRONMENT_NAME}
- tapOn: ${ENVIRONMENT_NAME}
- tapOn: Project
- tapOn: ${PROJECT_NAME}
- tapOn: ${WORKTREE_LABEL}
- assertVisible: Rename history readme
- assertVisible: Update history readme
- assertVisible: Initial commit
- assertVisible: Start of history.
- tapOn: Rename history readme
- assertVisible: Changed files
- assertVisible: ${README_PATH} → GUIDE.md
- assertVisible: renamed
- tapOn: ${README_PATH} → GUIDE.md
- assertVisible: rename from ${README_PATH}
- assertVisible: rename to GUIDE.md
- tapOn: Back to commit
- tapOn: Back to history
- tapOn: Update history readme
- assertVisible: History commit body
- assertVisible: Changed files
- assertVisible: ${README_PATH}
- assertVisible: modified
- tapOn: ${README_PATH}
- assertVisible:
    text: '[+]History readme'
- tapOn: Back to commit
- tapOn: Back to history
- tapOn:
    id: history-commit-${ROOT_OID}
- assertVisible: Root commit
- assertVisible: Changed files
- assertVisible: ${README_PATH}
- assertVisible: added
- tapOn: ${README_PATH}
- assertVisible:
    text: '[+]# Sample repository'
- tapOn: Back to commit
- tapOn: ${PROJECT_NAME} · ${WORKTREE_LABEL}
- tapOn: Project
- tapOn: ${PROJECT_NAME}
- tapOn: ${ORIGINAL_WORKTREE}
- assertNotVisible: Back to history
- assertVisible: Initial commit
- assertNotVisible: Rename history readme
- assertNotVisible: Update history readme
- tapOn:
    id: history-commit-${ROOT_OID}
- assertVisible: Root commit
- tapOn: ${PROJECT_NAME} · ${ORIGINAL_WORKTREE}
- tapOn: Project
- tapOn: ${PROJECT_NAME}
- tapOn: ${WORKTREE_LABEL}
- assertNotVisible: Back to history
- tapOn: Refresh history
- assertVisible: Rename history readme
