appId: com.fabiofiorita.porcelain.dev
name: Open a link and accept the system confirmation
---
- openLink: ${LINK}
- runFlow:
    when:
      visible: (Abrir|Open)
    commands:
      - takeScreenshot: link-confirmation-before-tap
      - tapOn: (Abrir|Open)
- takeScreenshot: link-after-confirmation
