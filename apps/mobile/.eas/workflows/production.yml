# Production release — manual only.
#
# Run it explicitly from the mobile app directory:
#
#   eas workflow:run .eas/workflows/production.yml
#
# Every run creates a new store-signed iOS production build and submits that
# exact build to App Store Connect. Use preview.yml for ad-hoc testing; this
# workflow has no OTA-only branch and no automatic GitHub Actions trigger.
# iOS-only workflow: the app also defines Android, but store release is intentionally iOS.

name: Production release

on:
  workflow_dispatch: {}

# No `concurrency` block: `cancel_in_progress` only accepts `true`, and a release
# run must never be cancelled by the next one.

jobs:
  build_ios:
    name: Build iOS production
    type: build
    params:
      platform: ios
      profile: production

  submit_ios:
    name: Submit iOS to App Store Connect
    needs: [build_ios]
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
