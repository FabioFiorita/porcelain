# Preview delivery — manual only.
#
# Run it explicitly from the mobile app directory:
#
#   eas workflow:run .eas/workflows/preview.yml
#
# Fingerprint unchanged -> EAS Update on `preview`, with no build credit.
# Fingerprint moved -> an internal iOS `preview` build. EAS provides an ad-hoc
# install link for the build; every physical iOS device must be registered with
# EAS before it can install that IPA. This workflow never submits to TestFlight.
#
# iOS-only workflow: the app also defines Android, but preview delivery is intentionally iOS.
#
# `message` truncates to 1024, EAS's hard limit; longer fails the run up front.

name: Preview delivery

on:
  # `{}` is required — a bare `workflow_dispatch:` is null, and the schema wants
  # an object.
  workflow_dispatch: {}

# No `concurrency` block: `cancel_in_progress` only accepts `true`, and
# cancelling a run does not refund a build already in flight — EAS only refunds
# builds cancelled before work starts.

jobs:
  fingerprint:
    name: Fingerprint
    type: fingerprint
    # Must match the build profile's environment or the hashes never line up.
    environment: preview

  get_ios_build:
    name: Check for a matching iOS build
    needs: [fingerprint]
    type: get-build
    params:
      platform: ios
      profile: preview
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      wait_for_in_progress: true

  publish_ios_update:
    name: Publish iOS preview update
    needs: [get_ios_build]
    if: ${{ needs.get_ios_build.outputs.build_id }}
    type: update
    params:
      channel: preview
      platform: ios
      message: ${{ substring(github.commit_message || 'Manual preview update', 0, 1024) }}

  build_ios:
    name: Build iOS preview
    needs: [get_ios_build]
    if: ${{ !needs.get_ios_build.outputs.build_id }}
    type: build
    params:
      platform: ios
      profile: preview
      message: ${{ substring(github.commit_message || 'Manual preview build', 0, 1024) }}
