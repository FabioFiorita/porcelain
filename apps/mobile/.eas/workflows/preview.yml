# Preview delivery — dispatched, never triggered.
#
# `on:` is `workflow_dispatch` only, and `scripts/lint-eas-triggers.mjs` fails
# the gate if a `push`, `pull_request`, or `schedule` trigger appears: a run
# spends ~2.4 minutes of the monthly workflow allowance (fingerprint 65s, update
# 81s) before anything reaches a tester, which is ~25 runs. Raise the EAS plan
# before allowing one.
#
#   eas workflow:run .eas/workflows/preview.yml
#
# Fingerprint unchanged -> EAS Update on `preview`, no build credit. Fingerprint
# moved -> a `preview` build, then TestFlight. Monthly iOS builds are capped and
# shared with every `development-simulator` build.
#
# iOS-only: `app.json` declares `"platforms": ["ios"]`.
#
# `message` truncates to 1024, EAS's hard limit; longer fails the run up front.
#
# Delivery is `type: submit`; `testflight` with a `build_id` is paid-tier, so no
# per-build "What to Test" note. Needs App Store Connect credentials on EAS.

name: Preview delivery

on:
  # `{}` is required — a bare `workflow_dispatch:` is null, and the schema wants
  # an object.
  workflow_dispatch: {}

# No `concurrency` block: `cancel_in_progress` only accepts `true`, and
# cancelling a run does not refund a build already in flight — EAS only refunds
# builds cancelled before work starts.

jobs:
  fingerprint:
    name: Fingerprint
    type: fingerprint
    # Must match the build profile's environment or the hashes never line up.
    environment: preview

  get_ios_build:
    name: Check for a matching iOS build
    needs: [fingerprint]
    type: get-build
    params:
      platform: ios
      profile: preview
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      wait_for_in_progress: true

  publish_ios_update:
    name: Publish iOS preview update
    needs: [get_ios_build]
    if: ${{ needs.get_ios_build.outputs.build_id }}
    type: update
    params:
      channel: preview
      platform: ios
      message: ${{ substring(github.commit_message || 'Manual preview update', 0, 1024) }}

  build_ios:
    name: Build iOS preview
    needs: [get_ios_build]
    if: ${{ !needs.get_ios_build.outputs.build_id }}
    type: build
    params:
      platform: ios
      profile: preview
      message: ${{ substring(github.commit_message || 'Manual preview build', 0, 1024) }}

  submit_ios:
    name: Send iOS preview to TestFlight
    needs: [build_ios]
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: preview
