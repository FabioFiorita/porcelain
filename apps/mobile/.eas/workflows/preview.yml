# Preview delivery — keep the TestFlight build current, cheaply.
#
# Runs on mobile PRs into main and mobile pushes to main; both are ship paths.
# Fingerprint unchanged -> EAS Update on the `preview` channel (no build credits).
# Fingerprint moved -> a `preview` build, then TestFlight. `wait_for_in_progress`
# makes a merge reuse its PR's build: get-build matches the hash, not the branch.
#
# To force a build when the fingerprint held, apply the GitHub label
# `eas-build-ios:preview` — EAS's own trigger (Project settings > GitHub), not
# something to reimplement here.
#
# iOS-only: `app.json` declares `"platforms": ["ios"]`.
#
# `message` truncates to 1024, EAS's hard limit; longer fails the run before it
# starts. `.husky/commit-msg` covers local commits, this covers what it cannot.
#
# Delivery is `type: submit`; `testflight` with a `build_id` requires a paid plan.
#
# Trade-off: no per-build "What to Test" note. Needs App Store Connect credentials
# on EAS, or the submit job is where the run fails.

name: Preview delivery

on:
  push:
    branches: ['main']
    paths: ['apps/mobile/**']
  pull_request:
    branches: ['main']
    paths: ['apps/mobile/**']

concurrency:
  cancel_in_progress: true
  # Custom groups are not supported yet; this is the placeholder value the docs
  # ask for so the file stays compatible when they are.
  group: ${{ workflow.filename }}-${{ github.ref }}

jobs:
  fingerprint:
    name: Fingerprint
    type: fingerprint
    # Must match the build profile's environment or the hashes never line up.
    environment: preview

  get_ios_build:
    name: Check for a matching iOS build
    needs: [fingerprint]
    type: get-build
    params:
      platform: ios
      profile: preview
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      wait_for_in_progress: true

  publish_ios_update:
    name: Publish iOS preview update
    needs: [get_ios_build]
    if: ${{ needs.get_ios_build.outputs.build_id }}
    type: update
    params:
      channel: preview
      platform: ios
      message: ${{ substring(github.event.pull_request.title || github.commit_message, 0, 1024) }}

  build_ios:
    name: Build iOS preview
    needs: [get_ios_build]
    if: ${{ !needs.get_ios_build.outputs.build_id }}
    type: build
    params:
      platform: ios
      profile: preview
      message: ${{ substring(github.event.pull_request.title || github.commit_message, 0, 1024) }}

  submit_ios:
    name: Send iOS preview to TestFlight
    needs: [build_ios]
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: preview
