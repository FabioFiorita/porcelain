appId: com.fabiofiorita.porcelain.dev
name: Pair and restore multiple environments
---
- launchApp
- tapOn: Settings
- assertVisible: Environments
- tapOn: Add environment
- assertVisible: Pair an environment
- tapOn: Pairing link
- inputText: invalid-link
- tapOn: Pair
- assertVisible: Paste the whole link porcelain pair printed, starting with http.
- tapOn: Cancel
- assertNotVisible: Pair an environment
- tapOn: Add environment
- tapOn: Pairing link
- inputText: ${FIRST_PAIRING_LINK}
- tapOn: Pair
- assertNotVisible: Pair an environment
- assertVisible: ${FIRST_ENVIRONMENT_NAME}
- assertVisible: Online
- tapOn: Add environment
- tapOn: Pairing link
- inputText: ${SECOND_PAIRING_LINK}
- tapOn: Pair
- assertNotVisible: Pair an environment
- assertVisible: ${FIRST_ENVIRONMENT_NAME}
- assertVisible: ${SECOND_ENVIRONMENT_NAME}
- assertVisible: Online
- stopApp
- launchApp
- tapOn: Settings
- assertVisible: ${FIRST_ENVIRONMENT_NAME}
- assertVisible: ${SECOND_ENVIRONMENT_NAME}
- assertVisible: Online
