appId: com.fabiofiorita.porcelain.dev
name: Await bounded native startup
---
- launchApp:
    permissions: {}
- openLink: porcelain.dev://?__expo_disable_fab=1&__expo_disable_auto_launch=1&__expo_disable_onboarding=1
- runFlow:
    when:
      visible: (Abrir|Open)
    commands:
      - tapOn: (Abrir|Open)
- extendedWaitUntil:
    visible: Review
    timeout: 30000
