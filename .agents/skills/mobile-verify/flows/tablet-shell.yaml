appId: com.fabiofiorita.porcelain.dev
name: Unpaired tablet split view
---
- launchApp
- setOrientation: LANDSCAPE_LEFT
- assertVisible: Workspaces
- assertVisible: No environments paired.
- tapOn: Files
- assertVisible:
    text: Files
    selected: true
- assertVisible: Select a worktree to continue.
- tapOn: Hide Sidebar
- assertNotVisible: Workspaces
- assertVisible:
    text: Files
    selected: true
- tapOn: Show Sidebar
- assertVisible: Workspaces
- assertVisible:
    text: Files
    selected: true
- tapOn: History
- assertVisible:
    text: History
    selected: true
- tapOn: Settings
- assertVisible:
    text: Settings
    selected: true
- assertVisible: Environments
- setOrientation: PORTRAIT
- assertVisible: Workspaces
- assertVisible:
    text: Settings
    selected: true
- assertVisible: Review
- assertVisible: Files
- assertVisible: History
- assertNotVisible: Previous Page
- assertNotVisible: Next Page
- tapOn: Review
- assertVisible:
    text: Review
    selected: true
- assertVisible: Select a worktree to continue.
